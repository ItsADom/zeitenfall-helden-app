<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heldenverwaltung</title>
    <!-- Favicon folgt der SYSTEM-/Browser-Einstellung (prefers-color-scheme),
         nicht dem app-internen Hell/Dunkel-Schalter: helle Variante (schwarzes ZK
         auf weiß) für helle Tableisten, dunkle (weißes ZK auf schwarz) für dunkle.
         Moderne Browser werten das `media` am Icon-Link aus. -->
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Farbwelt, Hell/Dunkel und Animation vor dem Rendern setzen, damit nichts
         kurz im Standard aufblitzt. Die Werte legt usePersistedState als JSON ab
         (Strings in Anführungszeichen, Booleans als true/false). Ohne getroffene
         Wahl folgt Hell/Dunkel bzw. Animation der Systemeinstellung. -->
    <script>
      (function () {
        var d = document.documentElement.dataset;
        var mm = function (q) { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
        try {
          var t = JSON.parse(localStorage.getItem('theme'));
          d.theme = typeof t === 'string' && t ? t : 'bronze';
        } catch (e) { d.theme = 'bronze'; }
        try {
          var m = JSON.parse(localStorage.getItem('theme-mode'));
          d.mode = m === 'light' || m === 'dark' ? m : (mm('(prefers-color-scheme: dark)') ? 'dark' : 'light');
        } catch (e) { d.mode = 'light'; }
        try {
          var a = JSON.parse(localStorage.getItem('theme-anim'));
          d.anim = (typeof a === 'boolean' ? a : !mm('(prefers-reduced-motion: reduce)')) ? 'on' : 'off';
        } catch (e) { d.anim = 'on'; }
        try {
          var w = JSON.parse(localStorage.getItem('dice-icons'));
          d.diceIcons = (typeof w === 'boolean' ? w : true) ? 'on' : 'off';
        } catch (e) { d.diceIcons = 'on'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
