<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heldenverwaltung</title>
    <!-- Farbthema vor dem Rendern setzen, damit nichts kurz im Standard aufblitzt.
         Wert wird von usePersistedState als JSON abgelegt (String in Anführungszeichen). -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('theme'));
        if (typeof t === 'string' && t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
